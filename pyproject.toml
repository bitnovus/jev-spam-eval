[project]
name = "spam-noul"
version = "0.1.0"
description = "Zero-shot spam filtering with TypeSafe Noul questions, compared with TF-IDF baselines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "typesafe-sdk>=0.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
]
